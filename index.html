<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автоматизация эмодзи-статуса</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--tg-theme-text-color, #18222d);
      background: var(--tg-theme-bg-color, #ffffff);
    }

    main {
      width: min(100%, 420px);
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      background: var(--tg-theme-secondary-bg-color, #f2f4f5);
    }

    .emoji {
      margin-bottom: 12px;
      font-size: 48px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.5;
      color: var(--tg-theme-hint-color, #708499);
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      color: var(--tg-theme-button-text-color, #ffffff);
      background: var(--tg-theme-button-color, #3390ec);
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.65;
    }

    #result {
      min-height: 24px;
      margin-top: 16px;
      margin-bottom: 0;
      font-weight: 600;
    }

    #user-id {
      margin-top: 8px;
      margin-bottom: 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">⏱️</div>
    <h1>Эмодзи-статус</h1>
    <p>Разрешите боту автоматически менять ваш статус по расписанию.</p>
    <button id="grant-access" type="button">Разрешить управление статусом</button>
    <p id="result" role="status" aria-live="polite"></p>
    <p id="user-id"></p>
  </main>

  <script>
    const telegram = window.Telegram?.WebApp;
    const button = document.querySelector("#grant-access");
    const result = document.querySelector("#result");
    const userId = document.querySelector("#user-id");

    if (!telegram) {
      button.disabled = true;
      result.textContent = "Откройте эту страницу через кнопку Open App в Telegram.";
    } else {
      telegram.ready();
      telegram.expand();

      const currentUserId = telegram.initDataUnsafe?.user?.id;
      if (currentUserId) {
        userId.textContent = `Ваш Telegram ID: ${currentUserId}`;
      }

      button.addEventListener("click", () => {
        if (typeof telegram.requestEmojiStatusAccess !== "function") {
          result.textContent = "Обновите Telegram: эта версия не поддерживает запрос доступа.";
          return;
        }

        button.disabled = true;
        result.textContent = "Ожидаем подтверждения…";

        telegram.requestEmojiStatusAccess((granted) => {
          button.disabled = false;
          result.textContent = granted
            ? "Доступ разрешён."
            : "Доступ не предоставлен.";
        });
      });
    }
  </script>
</body>
</html>
