name: Telegram emoji status

on:
  schedule:
    - cron: "0 7 * * 1-5"
      timezone: "Europe/Moscow"
    - cron: "0 16 * * 1-5"
      timezone: "Europe/Moscow"
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      status:
        description: Status to set
        required: true
        default: work
        type: choice
        options:
          - work
          - unavailable

permissions:
  contents: read

concurrency:
  group: telegram-emoji-status
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Choose and set emoji status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          MANUAL_STATUS: ${{ inputs.status }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail

          readonly WORK_EMOJI_ID="5909143321552359707"
          readonly UNAVAILABLE_EMOJI_ID="5413681529282905220"

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "Secret TELEGRAM_BOT_TOKEN is missing." >&2
            exit 1
          fi

          if [[ ! "${TELEGRAM_USER_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "Secret TELEGRAM_USER_ID is missing or invalid." >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            selected_status="${MANUAL_STATUS}"
          elif [[ "${EVENT_SCHEDULE}" == "0 7 * * 1-5" ]]; then
            selected_status="work"
          elif [[ "${EVENT_SCHEDULE}" == "0 16 * * 1-5" ]]; then
            selected_status="unavailable"
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            day_of_week="$(TZ=Europe/Moscow date +%u)"
            current_hour="$(TZ=Europe/Moscow date +%H)"
            current_minute="$(TZ=Europe/Moscow date +%M)"
            minutes_since_midnight=$((10#${current_hour} * 60 + 10#${current_minute}))

            if (( day_of_week <= 5 \
              && minutes_since_midnight >= 420 \
              && minutes_since_midnight < 960 )); then
              selected_status="work"
            else
              selected_status="unavailable"
            fi
          else
            echo "Unknown workflow trigger." >&2
            exit 1
          fi

          case "${selected_status}" in
            work)
              emoji_id="${WORK_EMOJI_ID}"
              ;;
            unavailable)
              emoji_id="${UNAVAILABLE_EMOJI_ID}"
              ;;
            *)
              echo "Unknown status: ${selected_status}" >&2
              exit 1
              ;;
          esac

          payload="$(jq -n \
            --argjson user_id "${TELEGRAM_USER_ID}" \
            --arg emoji_id "${emoji_id}" \
            '{
              user_id: $user_id,
              emoji_status_custom_emoji_id: $emoji_id
            }')"

          response="$(curl --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setUserEmojiStatus")"

          if [[ "$(jq -r '.ok' <<< "${response}")" != "true" ]]; then
            jq -r '.description // "Telegram API request failed."' <<< "${response}" >&2
            exit 1
          fi

          echo "Telegram status changed to: ${selected_status}"
          echo "### Telegram status updated" >> "${GITHUB_STEP_SUMMARY}"
          echo "Status: **${selected_status}**" >> "${GITHUB_STEP_SUMMARY}"
